name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Install quality tools
        run: python -m pip install ruff bandit pip-audit pytest-cov
      - name: Compile
        run: python -m compileall -q .
      - name: Test with coverage report
        run: python -m pytest -q --cov=motor --cov=validador --cov=comunicaciones --cov-report=term-missing
      - name: Ruff bug gate
        run: python -m ruff check --select F,B,E9 .
      - name: Bandit high/medium gate
        run: python -m bandit -r . -ll
      - name: Dependency audit
        run: python -m pip_audit

  windows-bundle:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install build dependencies
        run: python -m pip install -r requirements.lock pyinstaller==6.14.2
      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm Asistente_RUS.spec
      - name: Verify executable
        shell: pwsh
        run: if (-not (Test-Path "dist/Asistente_RUS.exe")) { throw "Executable missing" }
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: Get-FileHash "dist/Asistente_RUS.exe" -Algorithm SHA256 | Format-List | Out-File "dist/Asistente_RUS.exe.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Asistente_RUS-windows
          path: |
            dist/Asistente_RUS.exe
            dist/Asistente_RUS.exe.sha256.txt
          if-no-files-found: error
